<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#f4f0ec;color:#333;padding:20px;max-width:480px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}

.opt{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;transition:0.2s;}

.question{margin-bottom:24px;}
.q-title{font-weight:500;margin-bottom:16px;}
.result-box{background:#fff;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 2px 10px #00000010;}

  <button class="btn" onclick="startTest()">开始测试</button>

    <div class="result-tip" id="resTip"></div>

let currentQ = 0;
let score = {A:0,B:0,C:0,D:0,E:0,F:0};

// 切换页面
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 开始测试
function startTest(){
  currentQ = 0;
  score = {A:0,B:0,C:0,D:0,E:0,F:0};
  renderQ();
  showPage('page2');
}

// 渲染当前题目
function renderQ(){
  const q = questions[currentQ];
  document.getElementById('qTitle').innerText = q.q;
  const wrap = document.getElementById('optWrap');
  wrap.innerHTML = '';
  q.o.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerText = item.t;
    div.onclick = ()=> selectOpt(item.k);
    wrap.appendChild(div);
  })
}

// 选择选项
function selectOpt(k){
  score[k]++;
  currentQ++;
  if(currentQ >= questions.length){
    calcResult();
    showPage('page3');
    return;
  }
  renderQ();
}

// 计算结果（同分随机兜底）
function calcResult(){
  let maxVal = -1;
  let maxKeys = [];
  for(let k in score){
    if(score[k]>maxVal){
      maxVal = score[k];
      maxKeys = [k];
    }else if(score[k]==maxVal){
      maxKeys.push(k);
    }
  }
  // 同分随机选一个
  const finalK = maxKeys[Math.floor(Math.random()*maxKeys.length)];
  const r = resConfig[finalK];
  document.getElementById('resName').innerText = r.name;
  document.getElementById('resMain').innerText = r.main;
  document.getElementById('resTip').innerText = r.tip;
}

// 重新测试
function restart(){
  showPage('page1');
}
</script>

</html>
